site_name: mt5-gateway
site_description: A headless REST API for MetaTrader 5, running under Wine on Linux in Docker.
site_url: https://munashesydney.github.io/mt5-gateway/
repo_url: https://github.com/munashesydney/mt5-gateway
repo_name: munashesydney/mt5-gateway
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 elitekaycy (MIT) &middot; fork maintained by munashesydney for MetaTraderCloud

docs_dir: docs
site_dir: site

exclude_docs: |
  specs/
  plans/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-icon.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  favicon: assets/logo-icon.svg
  palette:
    - scheme: slate
      primary: black
      accent: green
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/extra.css

plugins:
  - search
  - mermaid2:
      version: 10.9.0
      arguments:
        theme: 'dark'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Quickstart: get-started/quickstart.md
      - Install MT5 + mt5-gateway on a terminal: get-started/install-mt5-terminal.md
      - Production deploy: get-started/production-deploy.md
  - Concepts:
      - concepts/index.md
      - Why this exists: concepts/why-headless-login.md
      - How headless login works: headless-login.md
      - Architecture: concepts/architecture.md
  - Connect:
      - Using with qkt: connect/qkt.md
  - Reference:
      - reference/index.md
      - Configuration: reference/configuration.md
      - API: reference/api.md
      - Ports & security: reference/ports-and-security.md
  - Operations:
      - operations/index.md
      - Health, kill switch, reconcile, metrics: operations/health-and-safety.md
      - Image size & profiles: operations/image-size.md
  - Contributing:
      - contributing.md
      - MT5 attestation: contributing/attestation.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/munashesydney/mt5-gateway
  generator: false
