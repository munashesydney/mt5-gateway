name: docs

# Builds the MkDocs Material site and deploys it to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs + plugins
        run: pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Verify this fork's Pages URL, matching mkdocs.yml. The upstream custom domain
  # is not configured here; use the repository site rather than its old hostname.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: read
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_URL: https://munashesydney.github.io/mt5-gateway/
    steps:
      - name: Check the Pages settings
        run: |
          read -r build_type site_url < <(gh api "repos/${{ github.repository }}/pages" --jq '"\(.build_type) \(.html_url)"')
          if [ "$build_type" != workflow ] || [ "$site_url" != "$SITE_URL" ]; then
            echo "::error::Pages is set to source=$build_type url=$site_url; expected source GitHub Actions and URL $SITE_URL (Settings > Pages)"
            exit 1
          fi

      - name: Check GitHub serves the site
        run: |
          for _ in $(seq 1 8); do
            code=$(curl --connect-timeout 10 --max-time 30 -s -o page.html -w "%{http_code}" "$SITE_URL" || true)
            [ "$code" = 200 ] && grep -q "mt5-gateway" page.html && exit 0
            sleep 15
          done
          echo "::error::GitHub Pages answered ${code:-nothing} for $SITE_URL after the deploy"
          exit 1
